<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Primeira API (Front)</title>
</head>
<body>
    <div class="conteiner">
        <h3>Testando requisições HTTP para a nossa Primeria API</h3>
        <hr>

        <h4>Endpoint ➡️ /localhost/primeira_api/hello</h4>
        <h4>Método 📎 GET</h4>
        <button id="botaoHello">Enviar</button>
        <hr>

        <h4>Endpoint ➡️ /localhost/primeira_api/echo</h4>
        <h4>Método 📲 POST</h4>
        <input type="text" id="inputEcho">
        <button id="botaoEcho">Enviar</button>
        <hr>

        <h4>Resposta da Requisição:</h4>
        <div id="resposta" class="resposta">

        </div>

    </div>
</body>
<script src="script.js"></script>
</html>
